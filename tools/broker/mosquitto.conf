# Lab broker for the Fault Record Bridge (same pattern as the "DataBus" Mosquitto container
# used in the SICAM A8000 MQTTX test document).  LAB USE ONLY.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 8883
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/broker.pem
keyfile /mosquitto/certs/broker.key
tls_version tlsv1.2
require_certificate false

# Fault records travel as chunks (default 128 KiB). Keep the limit above the bridge chunk size.
max_packet_size 2097152
persistence true
persistence_location /mosquitto/data/
log_dest stdout
